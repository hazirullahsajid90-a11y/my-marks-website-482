{

40`],

{
title:"۲۶ ـ Multithreading",
intro:"Multithreading د یوه پروګرام دننه د څو Threadونو د اجرا لپاره کارول کېږي. Thread د اجرا خپل مسیر لري.",
sections:[
["Thread څه شی دی؟",
`Thread د اجرا یو مسیر دی. د څو Threadونو په وسیله ځینې کارونه په موازي یا هم‌مهاله ډول پرمخ تللای شي، خو د واقعي Parallelism اندازه د سیستم، CPU او د اجرا چاپېریال پورې تړلې ده.` ,
`class Task extends Thread {
    @Override

        System.out.println("Task running");
    }
}

Task t = new Task();
t.start();`,
`Task running`],
["Runnable",
`Runnable د کار د تعریف لپاره Interface دی. Thread د اجرا د مسیر د مدیریت لپاره کارېږي. start() نوی Thread پیلوي؛ د run() مستقیم غږول یوازې عادي Method غږوي.` ,

`کله چې څو Threadونه ګډ Mutable Data بدلوي، Race Condition رامنځته کېدای شي. synchronized د ټاکلي Monitor پر بنسټ د لاسرسي همغږي کولو لپاره کارېږي؛ د ډیزاین له مخې نور Concurrency Tools هم شته.` ,

sections:[
["Compile-Time او Runtime Errors",
`Compile-Time Error د کوډ د ژبې یا Type قواعدو د ماتېدو له امله د Compiler له خوا ښودل کېږي.

`په IDE کې Breakpoint ټاکل کېږي، پروګرام اجرا کېږي او د متغیرونو ارزښتونه په Step-by-Step ډول کتل کېږي. د خطا د تکرار وړ مثال جوړول او د خطا د پیغام لوستل د Debugging مهمې برخې دي.`],

{
title:"۳۱ ـ Algorithms او Complexity",
intro:"Algorithm د یوې ستونزې د حل لپاره د ګامونو منظم ترتیب دی. Complexity د وخت او حافظې د اړتیا د ودې د اندازې تشریح کوي.",
sections:[
["Linear Search",
`Linear Search عناصر یو په بل پسې ګوري. که عنصر په پیل کې وي، ژر موندل کېږي؛ که په پای کې وي یا موجود نه وي، ښايي ټول عناصر وکتل شي.` ,
`static int linearSearch(int[] a, int target) {
    for (int i = 0; i < a.length; i++) {
        if (a[i] == target) {
            return i;
        }
    }
    return -1;
}

System.out.println(
    linearSearch(new int[]{4, 7, 9}, 7)
);`,
`1`,
`د Linear Search د وخت Complexity په عمومي Worst Case کې O(n) ده.`],
["Binary Search",
`Binary Search پر مرتب شوي Array کې په هر ګام د لټون ساحه نږدې نیمایي کوي. د سم کار لپاره Array باید مرتب وي.` ,
`static int binarySearch(int[] a, int target) {
    int left = 0;
    int right = a.length - 1;

    while (left <= right) {
        int mid = left + (right - left) / 2;

        if (a[mid] == target) return mid;
        if (a[mid] < target) left = mid + 1;
        else right = mid - 1;
    }
    return -1;
}

System.out.println(
    binarySearch(new int[]{2, 4, 6, 8}, 6)
);`,
`2`,
`د Binary Search د وخت Complexity O(log n) ده، خو د مرتب کولو شرط باید پوره وي.`],
["Big O",

let current = 0;
const nav = document.getElementById("nav");
const search = document.getElementById("search");

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[char]));
}

function renderNav(filter = "") {
  nav.innerHTML = "";
  lessons.forEach((lesson, index) => {
    if (!lesson.title.toLowerCase().includes(filter.toLowerCase())) return;
    const button = document.createElement("button");
    button.className = "navitem" + (index === current ? " active" : "");
    button.textContent = lesson.title;
    button.onclick = () => {
      current = index;
      renderLesson();
      renderNav(search.value);
      window.scrollTo({top: 0, behavior: "smooth"});
    };
    nav.appendChild(button);
  });
}

function renderLesson() {
  const lesson = lessons[current];
  document.getElementById("chapterNumber").textContent =
    "فصل " + (current + 1) + " له " + lessons.length;
  document.getElementById("lessonTitle").textContent = lesson.title;

  let html = `<p class="intro">${escapeHtml(lesson.intro)}</p>`;

  lesson.sections.forEach(section => {
    html += `<h2 class="section-title">${escapeHtml(section[0])}</h2>`;
    html += `<p>${escapeHtml(section[1]).replace(/\n/g, "<br>")}</p>`;

    if (section[2]) {
      html += `<div class="example">
        <div class="example-head">د Java کوډ</div>
        <pre><code>${escapeHtml(section[2])}</code></pre>`;

      if (section[3]) {
        html += `<div class="output-label">Output / پایله</div>
                 <div class="output">${escapeHtml(section[3])}</div>`;
      }
      html += `</div>`;
    }

    if (section[4]) {
      html += `<div class="note">${escapeHtml(section[4])}</div>`;
    }
  });

  document.getElementById("lesson").innerHTML = html;
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === lessons.length - 1;
  document.getElementById("progressFill").style.width =
    (((current + 1) / lessons.length) * 100) + "%";
}

document.getElementById("prev").onclick = () => {
  if (current > 0) {
    current--;
    renderLesson();
    renderNav(search.value);
    window.scrollTo({top: 0, behavior: "smooth"});
  }
};

document.getElementById("next").onclick = () => {
  if (current < lessons.length - 1) {
    current++;
    renderLesson();
    renderNav(search.value);
    window.scrollTo({top: 0, behavior: "smooth"});
  }
};

search.addEventListener("input", () => renderNav(search.value));

renderNav();
renderLesson();
</script>
</body>
